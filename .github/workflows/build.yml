name: Build Sing-box rulesets
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "LICENSE"
      - "README.md"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6
      - name: Checkout last rules
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: ruleset
          path: dist
          fetch-depth: 1
      - name: Checkout rules source
        uses: actions/checkout@v6
        with:
          repository: blackmatrix7/ios_rule_script
          ref: master
          path: source
          fetch-depth: 1
      - name: Download latest sing-rules-converter
        run: |
          set -euo pipefail

          download_url="$(python3 - <<'PY'
          import json
          import urllib.request

          api_url = "https://api.github.com/repos/solanab/sing-rules-converter/releases/latest"

          with urllib.request.urlopen(api_url) as response:
              release = json.load(response)

          for asset in release.get("assets", []):
              asset_url = asset.get("browser_download_url", "")
              if asset_url.endswith("-linux-x86_64"):
                  print(asset_url)
                  break
          else:
              raise SystemExit("Could not locate a linux-x86_64 sing-rules-converter asset")
          PY
          )"

          curl --fail --silent --show-error --location --output "sing-rules-converter" "${download_url}"
          chmod +x "sing-rules-converter"
      - name: Build rulesets
        run: |
          set -euo pipefail

          mkdir -p "dist"
          chmod +x "bm7_converter.sh"
          ./bm7_converter.sh "./source/rule/Clash" "./dist"
      - name: Git push assets to "ruleset" branch
        run: |
          set -euo pipefail

          cd "dist"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ ! -d .git ]; then
            git init --initial-branch=ruleset
          fi

          git add --all

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "⏲️ Sync ruleset $(TZ='UTC' date "+@ UTC %Y%m%d-%H%M%S")"

          git remote remove ruleset 2>/dev/null || true
          git remote add ruleset "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git push --set-upstream ruleset ruleset
